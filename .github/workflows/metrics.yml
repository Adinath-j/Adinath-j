name: Metrics
on:
  schedule: [{cron: "10 15 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          base: activity, community
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14