name: Update README with Recent Activity

on:
  schedule:
    - cron: '0 2 * * *'   # Runs daily at 02:00 UTC
    - cron: '10 15 * * *'   # Runs daily at 15:10 UTC (8:40 PM IST)
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write
  actions: read

jobs:
  update-readme:
    name: Update README Activity
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Update README with recent activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: '⚡ Update recent activity'   # Not used for commit, just for reference
          MAX_LINES: 10
          TARGET_FILE: README.md
          # Add event filtering if needed (see action docs)

      - name: 📝 Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "⚡ Update recent activity"
            git push origin main
            echo "✅ README updated successfully"
          else
            echo "✅ No changes needed"
          fi